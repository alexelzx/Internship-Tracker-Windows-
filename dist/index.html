<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage — internship email tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="onboarding" class="onboarding hidden"><div class="onboard-inner"><section class="onboard-copy"><div><div class="wordmark">Stage / internship tracker</div><h1>Find the right<br>short stay.</h1><p>A calm, clear place to keep every internship conversation moving.</p></div><div class="onboard-note">Your information stays in this browser.</div></section><section class="onboard-step" id="onboardStep"></section></div></div>
<div id="app" class="app hidden"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark"><span class="material-symbols-outlined">send</span></span>stage</div><button class="mobile-menu" id="mobileMenu"><span class="material-symbols-outlined">menu</span></button><nav class="nav"><button data-page="dashboard" class="active"><span class="material-symbols-outlined">space_dashboard</span>Dashboard</button><button data-page="emails"><span class="material-symbols-outlined">mail</span>Emails</button><button data-page="clocks"><span class="material-symbols-outlined">public</span>World clocks</button><button data-page="guides"><span class="material-symbols-outlined">menu_book</span>Guides</button></nav><div class="utility"><button id="exportBtn"><span class="material-symbols-outlined">download</span>Export backup</button><button id="importBtn"><span class="material-symbols-outlined">upload</span>Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></div><small>Built for thoughtful outreach</small></aside><main class="main"><header class="topbar"><div class="topbar-title" id="topbarTitle">Dashboard</div><div class="profile-pill"><span id="headerName"></span><span class="avatar" id="headerAvatar"></span></div></header><div class="content" id="content"></div></main></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script src="app.js" defer></script>
</body>
</html>
